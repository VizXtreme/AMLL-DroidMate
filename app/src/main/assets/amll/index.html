<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMLL Lyrics Player</title>
    <link rel="stylesheet" href="./frontend.css">

    <style>
        :root {
            color-scheme: dark;
            font-family: "SF Pro Display", "PingFang SC", system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        html {
            width: 100%;
            height: 100%;
            background: transparent;
        }
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        #app {
            width: 100%;
            height: 100%;
            min-height: 100%;
            position: relative;
            background: transparent;
        }
        
        /* make sure the lyric player inside cannot shrink to zero when empty */
        .amll-lyric-player {
            min-height: 100%;
        }

        #app .amll-lyric-player {
            background: transparent !important;
            color: #f5f7ff;
            font-family: var(--amll-lp-font-family, "SF Pro Display", "PingFang SC", system-ui, -apple-system, "Segoe UI", sans-serif);
            font-weight: 700;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.35);
            mix-blend-mode: plus-lighter !important;
            -webkit-text-fill-color: #f5f7ff;
            --amll-lp-color: #f5f7ff;
            --amll-lp-bg-color: rgba(0, 0, 0, 0.28);
            --amll-lp-hover-bg-color: rgba(255, 255, 255, 0.12);
            --amll-lp-font-size: clamp(30px, 4vh, 36px);
            --amll-lp-font-family: var(--amll-user-font-family, "SF Pro Display", "PingFang SC", system-ui, -apple-system, "Segoe UI", sans-serif);
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="text/javascript">
        // 添加版本标识便于调试
        console.log('[AMLL-INIT] index.html loaded - VERSION: 20260325-CSS-FIX');
        try {
            if (typeof Android !== 'undefined' && Android && typeof Android.log === 'function') {
                Android.log('[AMLL-INIT] index.html loaded - VERSION: 20260325-CSS-FIX', 'info');
            }
        } catch (e) {
            // Ignore Android interface errors
        }
    </script>
    <script src="./amll.bundle.js"></script>
</body>
</html>
