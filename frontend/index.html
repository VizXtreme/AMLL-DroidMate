<!DOCTYPE html>
<!--
  ============================================================================
  AMLL DroidMate Frontend - HTML 主入口
  ============================================================================
  
  这个 HTML 文件是嵌入到 Android WebView 中的歌词界面的入口点。
  它负责加载前端 bundle（AMLL core）和所有必要的资源，用于在 WebView 中渲染歌词界面。
  ========================================================================== -->
<html>
<head>
    <!-- 字符编码：使用 UTF-8 支持多语言 -->
    <meta charset="UTF-8" />
    
    <!-- 视口设置：响应式布局，适配不同屏幕尺寸 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 页面标题：显示在浏览器标签页上 -->
    <title>AMLL DroidMate Frontend WebView</title>

    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <div id="app"></div>
    
    <!-- JavaScript: load AMLL bundle -->
    <script>
        (function () {
            import('./amll.bundle.js');
        })();
    </script>
</body>
</html>
