<!DOCTYPE html>
<!--
  ============================================================================
  AMLL DroidMate Frontend - HTML 主入口
  ============================================================================
  
  这个 HTML 文件是嵌入到 Android WebView 中的歌词界面的入口点。
  它负责加载 React 应用和所有必要的资源，提供华丽的歌词渲染效果。
  
  **关键功能**：
  1. 加载样式表（frontend.css）
  2. 禁用浏览器缓存（确保最新代码生效）
  3. 定义 React 应用的挂载点（#app）
  4. 加载打包后的 JavaScript  bundle（amll.bundle.js）
  
  **构建流程**：
  - 开发时：通过 Vite 开发服务器提供热更新
  - 生产时：打包到 app/src/main/assets/amll/ 目录
  ========================================================================== -->
<html lang="en">
<head>
    <!-- 字符编码：使用 UTF-8 支持多语言 -->
    <meta charset="UTF-8" />
    
    <!-- 视口设置：响应式布局，适配不同屏幕尺寸 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 页面标题：显示在浏览器标签页上 -->
    <title>AMLL DroidMate Frontend WebView</title>
    
    <!-- 样式表：引入内联的 CSS 文件（包含所有样式） -->
    <link rel="stylesheet" href="./frontend.css" />
    <!-- ==================== 禁用缓存 ==================== -->
    <!-- 这三个 meta 标签确保 WebView 始终使用最新的代码，不使用缓存 -->
    <!-- Cache-Control: no-cache, no-store, must-revalidate (HTTP 1.1) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <!-- Pragma: no-cache (HTTP 1.0 向后兼容) -->
    <meta http-equiv="Pragma" content="no-cache" />
    <!-- Expires: 0 (立即过期) -->
    <meta http-equiv="Expires" content="0" />
    <!-- ==================== 内联样式 ==================== -->
    <!-- 覆盖浏览器默认的用户代理样式表，确保与 Android 原生样式一致 -->
    <style>
        /* Body 元素：强制设置为 block，移除边距和内边距 */
        body {
            display: block !important;  /* 使用 !important 覆盖库默认值 */
            margin: 0 !important;
            padding: 0 !important;
        }
        /* HTML 根元素：移除所有边距和内边距 */
        html {
            margin: 0 !important;
            padding: 0 !important;
        }
    </style>
</head>
<body>
    <!-- React 应用挂载点 -->
    <!-- AMLL React 组件会渲染到这个 div 中 -->
    <div id="app"></div>
    
    <!-- JavaScript Bundle -->
    <!-- 这是通过 Vite 打包后的 React 应用，包含所有歌词渲染逻辑 -->
    <script src="./amll.bundle.js"></script>
</body>
</html>
